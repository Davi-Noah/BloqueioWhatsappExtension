<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Bloqueio WhatsApp</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <span class="brand">Bloqueio WhatsApp</span>
        <button class="icon-button" id="settings" type="button" aria-label="Abrir configurações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 13.5 1.2 1-.1 1.8-1.9 1.1-1.5-.5a7.7 7.7 0 0 1-1.3.8l-.4 1.5-1.6.8-1.6-.8-.4-1.5a7.7 7.7 0 0 1-1.3-.8l-1.5.5-1.9-1.1-.1-1.8 1.2-1a7 7 0 0 1 0-1.5l-1.2-1 .1-1.8 1.9-1.1 1.5.5a7.7 7.7 0 0 1 1.3-.8l.4-1.5 1.6-.8 1.6.8.4 1.5a7.7 7.7 0 0 1 1.3.8l1.5-.5 1.9 1.1.1 1.8-1.2 1a7 7 0 0 1 0 1.5Z"/></svg>
        </button>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="shield-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 19 6v5.4c0 4.2-2.9 7.6-7 9.4-4.1-1.8-7-5.2-7-9.4V6l7-2.8Z"/><path d="m8.7 12 2.1 2.1 4.6-4.7"/></svg>
        </div>
        <h1 id="status-title">Proteção ativa</h1>
        <p id="status">Verificando a aba atual…</p>
      </section>

      <button class="primary-button" id="lock" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg>
        Bloquear esta aba
      </button>

      <div class="shortcut-chip" id="shortcut-chip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M10 9h.01M13 9h.01M16 9h.01M7 13h7M16 13h1"/></svg>
        <span id="shortcut">Atalho não definido</span>
      </div>

      <aside class="hint-card" id="hint" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
        <p><strong>Não está no WhatsApp?</strong><br>Abra o WhatsApp Web para bloquear a aba atual.</p>
      </aside>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
